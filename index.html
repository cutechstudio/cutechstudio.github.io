<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cutech Studio</title>
  <meta name="description" content="Cutech Studio: apps sencillas y bonitas para Android.">
  <style>
    :root { color-scheme: light dark; --bg: #fdf7fb; --fg: #2b2230; --muted: #6d6172; --accent: #7B1FA2; --card: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b161d; --fg: #f3ecf5; --muted: #b3a7b8; --accent: #ce93d8; --card: #262029; } }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; }
    main { max-width: 640px; margin: 0 auto; padding: 56px 24px; }
    h1 { font-size: 2.2rem; margin: 0 0 4px; color: var(--accent); }
    .lema { color: var(--muted); margin: 0 0 40px; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    .app { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .app h3 { margin: 0 0 4px; }
    .app p { margin: 0 0 12px; color: var(--muted); }
    a { color: var(--accent); }
    footer { margin-top: 48px; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Cutech Studio</h1>
    <p class="lema">Apps sencillas y bonitas para Android.</p>

    <h2>Nuestras apps</h2>
    <div class="app">
      <h3>CuteDown: Countdown Widget</h3>
      <p>Cuentas atrás para tus fechas especiales, con widgets para la pantalla de inicio.</p>
      <a href="https://play.google.com/store/apps/details?id=com.cutechstudio.cutedown">Ver en Google Play</a>
      · <a href="https://sites.google.com/view/cutedown-privacy-policy/inicio">Política de privacidad</a>
    </div>

    <footer>
      Contacto: <a href="mailto:monicapc.dev@gmail.com">monicapc.dev@gmail.com</a>
    </footer>
  </main>
</body>
</html>
